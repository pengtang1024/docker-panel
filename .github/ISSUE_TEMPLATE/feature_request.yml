name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue，避免重复。
        项目定位是**极简、单二进制、纯软件渲染、零依赖**。与此冲突的建议（引入额外运行时、重型依赖、扩大职责范围）可能不被接受，请说明为何现有能力无法满足。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景 / 问题
      description: 描述具体使用场景，以及现在卡在哪里
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的行为
      description: 你希望界面或行为变成什么样
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 试过的其它做法、现有功能变通，以及为什么不够用
    validations:
      required: false
  - type: dropdown
    id: pr
    attributes:
      label: 是否愿意提交 PR
      description: 愿意动手的实现者优先获得响应
      options: [愿意, 需要指导, 仅建议]
    validations:
      required: true
