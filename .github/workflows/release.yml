name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 读取 tag 版本
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: 安装 Linux GUI 依赖
        run: |
          sudo apt-get update
          # libfontconfig1-dev 连带 libfreetype-dev → zlib1g-dev/libbz2-dev/libpng-dev/libbrotli-dev，
          # 缺任何一个都会让 yeslogic-fontconfig-sys 的 build script 找不到 fontconfig.pc 而 panic。
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libx11-dev libwayland-dev \
            libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --locked

      - name: 构建验签启动器
        # 启动器是 workspace 的另一个成员：在仓库根跑 `cargo build` 只会构建根包，
        # 必须单独 -p 指定。它只依赖 base64 / ed25519-dalek / libc / sha2。
        run: cargo build --release --locked -p docker-panel-launcher

      - name: 生成 deb 包
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          stage=docker-panel_"$version"_amd64
          rm -rf "$stage"
          install -d "$stage/DEBIAN" "$stage/usr/bin" \
            "$stage/usr/lib/docker-panel/seed" \
            "$stage/usr/share/applications" "$stage/usr/share/icons/hicolor/scalable/apps" \
            "$stage/usr/share/doc/docker-panel"
          # /usr/bin/docker-panel 是启动器（root 所有、非 setuid、无 capabilities）；
          # 真运行体放 /usr/lib/docker-panel/seed/，启动器在种子与用户副本间挑最高版本。
          install -m 0755 target/release/docker-panel-launcher "$stage/usr/bin/docker-panel"
          install -m 0755 target/release/docker-panel "$stage/usr/lib/docker-panel/seed/docker-panel"
          printf '%s\n' "$version" > "$stage/usr/lib/docker-panel/seed/version"
          install -m 0644 packaging/docker-panel.desktop "$stage/usr/share/applications/docker-panel.desktop"
          install -m 0644 packaging/docker-panel.svg "$stage/usr/share/icons/hicolor/scalable/apps/docker-panel.svg"
          install -m 0644 packaging/debian/copyright "$stage/usr/share/doc/docker-panel/copyright"
          install -m 0644 LICENSE LICENSING.md THIRD-PARTY-NOTICES.md "$stage/usr/share/doc/docker-panel/"
          cp -r licenses "$stage/usr/share/doc/docker-panel/licenses"
          sed "s/^Version: .*/Version: $version/" packaging/debian/control > "$stage/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$stage"
          echo "deb=docker-panel_${version}_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: 生成校验和
        id: sum
        run: |
          version="${{ steps.ver.outputs.version }}"
          # 自动更新会校验这两个资产：deb 与裸二进制都必须有 sha256 条目。
          # 裸二进制必须在 target/release 目录内执行 sha256sum，否则路径会写成
          # target/release/docker-panel，与实际资产名 docker-panel 对不上。
          sha256sum "docker-panel_${version}_amd64.deb" > checksums.txt
          (cd target/release && sha256sum docker-panel >> "$GITHUB_WORKSPACE/checksums.txt")
          cat checksums.txt

      - name: 生成更新清单
        # 顺序约束见 docs/arch/update-manifest.md §3：必须在「生成校验和」之后，
        # sha256 只从 checksums.txt 抽取（两份来源分头计算迟早漂移）；
        # 清单与 checksums.txt 同一批上传，避免出现「清单指向不存在的资产」窗口。
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          deb="docker-panel_${version}_amd64.deb"
          bin="target/release/docker-panel"
          sha_of() { awk -v n="$1" '$2 == n {print $1}' checksums.txt; }
          deb_sha="$(sha_of "$deb")"
          bin_sha="$(sha_of "docker-panel")"
          if [ -z "$deb_sha" ] || [ -z "$bin_sha" ]; then
            echo "::error::checksums.txt 缺少 deb 或裸二进制条目"
            exit 1
          fi
          deb_size="$(stat -c%s "$deb")"
          bin_size="$(stat -c%s "$bin")"
          version_code="$(awk -F. '{printf "%d", $1*1000000 + $2*1000 + $3}' <<< "$version")"
          cat > version.json <<EOF
          {
            "schema": 1,
            "version": "${version}",
            "version_code": ${version_code},
            "channel": "stable",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "mandatory": false,
            "notes_url": "https://github.com/pengtang1024/docker-panel/releases/tag/${version}",
            "assets": {
              "deb": { "name": "${deb}", "size": ${deb_size}, "sha256": "${deb_sha}" },
              "binary": { "name": "docker-panel", "size": ${bin_size}, "sha256": "${bin_sha}" }
            }
          }
          EOF
          # 结构自检：清单坏了宁可在发布前失败，也不要让客户端拿到半成品
          python3 -m json.tool version.json > /dev/null
          cat version.json

      - name: 提取版本更新日志
        run: |
          version="${{ steps.ver.outputs.version }}"
          scripts/release-notes.sh "$version" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md 里没有 [$version] 段落，Release 页面将没有更新日志"
            exit 1
          fi
          # Slint Royalty-free 2.0 §2(b)：二进制下载页必须展示署名
          cat >> release-notes.md <<'EOF'

          ---

          <a href="https://slint.dev"><img src="https://raw.githubusercontent.com/slint-ui/slint/master/logo/MadeWithSlint-logo-whitebg.png" alt="Made with Slint" height="24"></a>

          本项目使用 [Slint](https://slint.dev) 1.18.1，按 Slint Royalty-free 2.0 许可使用。
          第三方组件与许可文本见 [THIRD-PARTY-NOTICES.md](https://github.com/pengtang1024/docker-panel/blob/master/THIRD-PARTY-NOTICES.md)。
          EOF
          cat release-notes.md

      - name: 打包许可全文
        run: tar -czf licenses.tar.gz licenses

      # ⚠️ immutable releases：**已发布**的 Release 一律拒绝补传资产
      # （422 Cannot upload assets to an immutable release）。所以顺序必须是
      # 「建 draft → 上传 8 个资产 → 维护者离线签名补齐 2 个 .sig → 再 draft=false」，
      # 一步到位（draft: false + files）
      # 在开启 immutable 的仓库里必失败，且失败时 Release 已经对外可见、无法补救。
      - name: 创建草稿 Release 并上传资产
        id: release
        uses: softprops/action-gh-release@v3
        with:
          name: docker-panel ${{ steps.ver.outputs.version }}
          draft: true
          # body_path = CHANGELOG.md 里该版本的完整段落（发版页面显示真正的更新日志，
          # 而不是 GitHub 自动生成的 "**Full Changelog**: <compare 链接>"——本仓库没有 PR，
          # 自动生成基本是空的）。generate_release_notes 保留，GitHub 会把 compare 链接追加在后面。
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            docker-panel_${{ steps.ver.outputs.version }}_amd64.deb
            target/release/docker-panel
            checksums.txt
            version.json
            LICENSE
            LICENSING.md
            THIRD-PARTY-NOTICES.md
            licenses.tar.gz

      - name: 校验草稿资产齐全（不发布，等维护者离线签名）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.version }}"
          rel_id="${{ steps.release.outputs.id }}"
          # 草稿在发布前**不按 tag 索引**：`GET /releases/tags/{tag}` 对 draft 返回 404
          # （0.7.17 就是这样在 CI 里失败、只能手工 PATCH 发布的）。所以定位草稿只能用
          # 上一步 action 输出的 release id。
          [ -n "$rel_id" ] || { echo "::error::拿不到草稿 Release id"; exit 1; }
          # 资产不全就不进入签名阶段：半截 Release 比没有更糟（用户下到 404 的资产链接，
          # 而 immutable 下补传又被拒 → 只能发新版本补救）。
          assets="$(gh api "repos/${{ github.repository }}/releases/${rel_id}/assets" --jq '.[].name' | sort | tr '\n' ' ')"
          count="$(printf '%s' "$assets" | wc -w)"
          echo "draft 资产（${count}）：${assets}"
          for f in docker-panel_${tag}_amd64.deb docker-panel checksums.txt version.json \
                   LICENSE LICENSING.md THIRD-PARTY-NOTICES.md licenses.tar.gz; do
            case " $assets " in
              *" $f "*) ;;
              *) echo "::error::draft Release 缺少资产 $f，拒绝继续"; exit 1 ;;
            esac
          done
          # 私钥不在 CI：流水线到此为止，Release 保持 draft（对用户不可见）。
          # 维护者在本机跑 `scripts/sign-release.sh <version>`：离线签名 → 补传
          # version.json.sig / checksums.txt.sig → 发布 → 同步 master → 刷 jsDelivr。
          echo "✅ 草稿 ${tag} 已就绪（${count} 个资产，尚未发布）"
          echo "👉 下一步：scripts/sign-release.sh ${tag}"

      # 历史版本（流水线修好之前发的）页面只有一行 "**Full Changelog**: ..."，
      # 这里用 CHANGELOG.md 的段落回填。immutable release 改不了就跳过，不影响本次发布。
      - name: 回填历史 Release 更新日志
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          current="${{ steps.ver.outputs.version }}"
          # 用 API 列 release，不能用 `git tag --list`：actions/checkout 默认是
          # shallow clone，仓库里只有触发流水线的那个 tag，历史 tag 一个都取不到。
          for tag in $(gh release list --limit 20 --json tagName -q '.[].tagName' \
                        | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'); do
            [ "$tag" = "$current" ] && continue
            notes=$(scripts/release-notes.sh "$tag" 2>/dev/null) || continue
            [ -n "$notes" ] || continue
            head_line=$(printf '%s\n' "$notes" | head -1)
            body=$(gh release view "$tag" --json body -q .body 2>/dev/null) || continue
            case "$body" in
              *"$head_line"*) continue ;;
            esac
            if gh release edit "$tag" --notes "$notes" >/dev/null 2>&1; then
              echo "已回填 $tag 的更新日志"
            else
              echo "::warning::$tag 的更新日志回填失败（可能是 immutable release）"
            fi
          done
