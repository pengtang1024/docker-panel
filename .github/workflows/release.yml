name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: 打包并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 读取 tag 版本
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: 安装 Linux GUI 依赖
        run: |
          sudo apt-get update
          # libfontconfig1-dev 连带 libfreetype-dev → zlib1g-dev/libbz2-dev/libpng-dev/libbrotli-dev，
          # 缺任何一个都会让 yeslogic-fontconfig-sys 的 build script 找不到 fontconfig.pc 而 panic。
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libx11-dev libwayland-dev \
            libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --locked

      - name: 生成 deb 包
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          stage=docker-panel_"$version"_amd64
          rm -rf "$stage"
          install -d "$stage/DEBIAN" "$stage/usr/bin" \
            "$stage/usr/share/applications" "$stage/usr/share/icons/hicolor/scalable/apps" \
            "$stage/usr/share/doc/docker-panel"
          install -m 0755 target/release/docker-panel "$stage/usr/bin/docker-panel"
          install -m 0644 packaging/docker-panel.desktop "$stage/usr/share/applications/docker-panel.desktop"
          install -m 0644 packaging/docker-panel.svg "$stage/usr/share/icons/hicolor/scalable/apps/docker-panel.svg"
          install -m 0644 packaging/debian/copyright "$stage/usr/share/doc/docker-panel/copyright"
          install -m 0644 LICENSE LICENSING.md THIRD-PARTY-NOTICES.md "$stage/usr/share/doc/docker-panel/"
          cp -r licenses "$stage/usr/share/doc/docker-panel/licenses"
          sed "s/^Version: .*/Version: $version/" packaging/debian/control > "$stage/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$stage"
          echo "deb=docker-panel_${version}_amd64.deb" >> "$GITHUB_OUTPUT"

      - name: 生成校验和
        id: sum
        run: |
          version="${{ steps.ver.outputs.version }}"
          # 自动更新会校验这两个资产：deb 与裸二进制都必须有 sha256 条目。
          # 裸二进制必须在 target/release 目录内执行 sha256sum，否则路径会写成
          # target/release/docker-panel，与实际资产名 docker-panel 对不上。
          sha256sum "docker-panel_${version}_amd64.deb" > checksums.txt
          (cd target/release && sha256sum docker-panel >> "$GITHUB_WORKSPACE/checksums.txt")
          cat checksums.txt

      - name: 提取版本更新日志
        run: |
          version="${{ steps.ver.outputs.version }}"
          scripts/release-notes.sh "$version" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md 里没有 [$version] 段落，Release 页面将没有更新日志"
            exit 1
          fi
          # Slint Royalty-free 2.0 §2(b)：二进制下载页必须展示署名
          cat >> release-notes.md <<'EOF'

          ---

          <a href="https://slint.dev"><img src="https://raw.githubusercontent.com/slint-ui/slint/master/logo/MadeWithSlint-logo-whitebg.png" alt="Made with Slint" height="24"></a>

          本项目使用 [Slint](https://slint.dev) 1.18.1，按 Slint Royalty-free 2.0 许可使用。
          第三方组件与许可文本见 [THIRD-PARTY-NOTICES.md](https://github.com/pengtang1024/docker-panel/blob/master/THIRD-PARTY-NOTICES.md)。
          EOF
          cat release-notes.md

      - name: 打包许可全文
        run: tar -czf licenses.tar.gz licenses

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: docker-panel ${{ steps.ver.outputs.version }}
          draft: false
          # body_path = CHANGELOG.md 里该版本的完整段落（发版页面显示真正的更新日志，
          # 而不是 GitHub 自动生成的 "**Full Changelog**: <compare 链接>"——本仓库没有 PR，
          # 自动生成基本是空的）。generate_release_notes 保留，GitHub 会把 compare 链接追加在后面。
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            docker-panel_${{ steps.ver.outputs.version }}_amd64.deb
            target/release/docker-panel
            checksums.txt
            LICENSE
            LICENSING.md
            THIRD-PARTY-NOTICES.md
            licenses.tar.gz

      # 历史版本（流水线修好之前发的）页面只有一行 "**Full Changelog**: ..."，
      # 这里用 CHANGELOG.md 的段落回填。immutable release 改不了就跳过，不影响本次发布。
      - name: 回填历史 Release 更新日志
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          current="${{ steps.ver.outputs.version }}"
          # 用 API 列 release，不能用 `git tag --list`：actions/checkout 默认是
          # shallow clone，仓库里只有触发流水线的那个 tag，历史 tag 一个都取不到。
          for tag in $(gh release list --limit 20 --json tagName -q '.[].tagName' \
                        | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'); do
            [ "$tag" = "$current" ] && continue
            notes=$(scripts/release-notes.sh "$tag" 2>/dev/null) || continue
            [ -n "$notes" ] || continue
            head_line=$(printf '%s\n' "$notes" | head -1)
            body=$(gh release view "$tag" --json body -q .body 2>/dev/null) || continue
            case "$body" in
              *"$head_line"*) continue ;;
            esac
            if gh release edit "$tag" --notes "$notes" >/dev/null 2>&1; then
              echo "已回填 $tag 的更新日志"
            else
              echo "::warning::$tag 的更新日志回填失败（可能是 immutable release）"
            fi
          done
