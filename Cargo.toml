[package]
name = "dvkit"
version = "0.2.0"
edition = "2021"
description = "极简 Docker 桌面管理工具（Slint 原生 GUI，软件渲染器零 GPU 依赖）"

[dependencies]
# Slint：关闭默认 backend，手动选 winit + 软件渲染器，极致轻量
slint = { version = "1.14", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
] }

# Docker API
bollard = "0.21"
futures = "0.3"
serde_json = "1"
anyhow = "1"

# 极简 tokio：单线程运行时（current_thread）减少资源占用
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync"] }

[profile.release]
opt-level = "z"      # 体积最小化
lto = true            # 链接时优化
codegen-units = 1     # 单编译单元 = 更好的优化
strip = "symbols"     # 去除符号表
panic = "abort"       # panic 直接 abort，省掉 unwind 信息
