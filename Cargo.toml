[package]
name = "docker-panel"
version = "0.2.3"
edition = "2021"
description = "极简 Docker 桌面管理工具（Slint 原生 GUI，软件渲染器零 GPU 依赖）"

[dependencies]
# Slint：关闭默认 backend，手动选 winit + 软件渲染器，极致轻量
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
] }

# Docker API
bollard = "0.21"
futures = "0.3"
futures-util = "0.3"
serde_json = "1"
anyhow = "1"

# tokio 多线程运行时（不能用 current_thread：单线程下后台 Docker 任务可能无法调度）
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "rt"] }

[build-dependencies]
slint-build = "1.18.1"

# 本地补丁：Wayland 下 softbuffer buffer age 语义不可靠，slint 软件渲染器
# 依据 age 做部分重绘会导致 buffer 未重绘区域永久黑块。强制全量重绘修复。
# 见 vendor/i-slint-backend-winit-1.18.1/renderer/sw.rs
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit-1.18.1" }
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software-1.18.1" }

[profile.release]
opt-level = "z"      # 体积最小化
lto = true            # 链接时优化
codegen-units = 1     # 单编译单元 = 更好的优化
strip = "symbols"     # 去除符号表
panic = "abort"       # panic 直接 abort，省掉 unwind 信息
