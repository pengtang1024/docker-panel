# cargo-deny 配置：许可证门禁
# 运行：cargo deny check licenses
# 规则：只允许宽松许可 + 本项目明确选择的 Slint Royalty-free 2.0 分支。
# 引入 GPL / AGPL / LGPL / SSPL / BUSL / Commons Clause 时本检查必须失败。

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "LicenseRef-Slint-Royalty-free-2.0",
]
