[package]
name = "docker-panel-launcher"
version = "0.9.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "docker-panel 验签启动器：在 deb 种子与用户副本之间挑版本更高且签名通过的那份 execveat"
license = "MIT"

[[bin]]
name = "docker-panel-launcher"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
libc = "0.2"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
