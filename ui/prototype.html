<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Docker Panel</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--r:14px;--r-sm:6px;--r-md:8px;--r-xs:4px;--f:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;--m:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  :root,[data-theme="light"]{
    --bg:#f7f7f8;--card:#fff;--line:#ebeaee;--line-2:#f4f4f5;
    --ink:#0e0e11;--ink-2:#52525b;--ink-3:#a1a1aa;--ink-4:#d4d4d8;
    --ok:#16a34a;--stop:#a1a1aa;--warn:#d97706;--err:#dc2626;--accent:#0e0e11;
    --pill-on-bg:rgba(22,163,74,.10);--pill-off-bg:rgba(161,161,170,.14);
    --bar-bg:#f0f0f3;--bar-cpu:#3b82f6;--bar-mem:#8b5cf6;
    --shadow:0 1px 2px rgba(14,14,17,.04),0 4px 16px rgba(14,14,17,.05);
    --shadow-hover:0 2px 4px rgba(14,14,17,.05),0 12px 32px rgba(14,14,17,.10);
    --overlay:rgba(14,14,17,.4);--skel:#ebeaee;--skel-hi:#f4f4f5;
    --log-bg:#f4f4f5;--log-ink:#0e0e11;--log-dim:#a1a1aa;
    --tip-bg:#fff;--tip-ink:#0e0e11;--tip-arrow:#fff;
  }
  [data-theme="dark"]{
    --bg:#0c0c0e;--card:#18181b;--line:#27272a;--line-2:#1f1f23;
    --ink:#fafafa;--ink-2:#a1a1aa;--ink-3:#71717a;--ink-4:#3f3f46;
    --ok:#4ade80;--stop:#71717a;--warn:#fbbf24;--err:#f87171;--accent:#fafafa;
    --pill-on-bg:rgba(74,222,128,.14);--pill-off-bg:rgba(113,113,122,.18);
    --bar-bg:#27272a;--bar-cpu:#60a5fa;--bar-mem:#a78bfa;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --shadow-hover:0 2px 4px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
    --overlay:rgba(0,0,0,.55);--skel:#1f1f23;--skel-hi:#27272a;
    --log-bg:#000;--log-ink:#e4e4e7;--log-dim:#52525b;
    --tip-bg:#18181b;--tip-ink:#fafafa;--tip-arrow:#18181b;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]){
      --bg:#0c0c0e;--card:#18181b;--line:#27272a;--line-2:#1f1f23;
      --ink:#fafafa;--ink-2:#a1a1aa;--ink-3:#71717a;--ink-4:#3f3f46;
      --ok:#4ade80;--stop:#71717a;--warn:#fbbf24;--err:#f87171;--accent:#fafafa;
      --pill-on-bg:rgba(74,222,128,.14);--pill-off-bg:rgba(113,113,122,.18);
      --bar-bg:#27272a;--bar-cpu:#60a5fa;--bar-mem:#a78bfa;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
      --shadow-hover:0 2px 4px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45);
      --overlay:rgba(0,0,0,.55);--skel:#1f1f23;--skel-hi:#27272a;
      --log-bg:#000;--log-ink:#e4e4e7;--log-dim:#52525b;
      --tip-bg:#18181b;--tip-ink:#fafafa;--tip-arrow:#18181b;
    }
  }
  body{font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
  .app{width:1280px;height:780px;margin:16px auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-hover);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:background .2s,color .2s}

  /* ===== Top ===== */
  .top{height:48px;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid var(--line);background:var(--card)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em}
  .brand .mark{width:26px;height:26px;border-radius:var(--r-md);background:var(--ink);display:grid;place-items:center;color:var(--bg)}
  .conn{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ok);font-weight:600;margin-left:2px}
  .conn .d{width:6px;height:6px;border-radius:3px;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 40%,transparent);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 40%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .search{margin-left:auto;width:300px;height:32px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--line-2);display:flex;align-items:center;padding:0 10px;gap:8px;font-size:12px;color:var(--ink-3);cursor:pointer;transition:border-color .15s,background .15s}
  .search:hover{border-color:var(--ink-4)}
  .search:focus-within{border-color:var(--ink-3);background:var(--card)}
  .search .si{display:flex;align-items:center;justify-content:center;width:14px;height:14px;flex-shrink:0}
  .search input{flex:1;border:none;background:transparent;outline:none;font-family:var(--f);font-size:12px;color:var(--ink);min-width:0}
  .search input::placeholder{color:var(--ink-3)}
  .search .k{font-size:10px;color:var(--ink-3);font-family:var(--m);padding:1px 6px;border:1px solid var(--line);border-radius:var(--r-xs);background:transparent;line-height:1.3;letter-spacing:.02em}
  .icon-btn{width:32px;height:32px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:all .12s}
  .icon-btn:hover{background:var(--bg);color:var(--ink)}
  .btn{height:32px;padding:0 12px;border-radius:var(--r-md);border:none;font-family:var(--f);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s;white-space:nowrap}
  .btn.filled{background:var(--ink);color:var(--bg)}
  .btn.filled:hover{filter:brightness(1.15)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
  .btn.ghost:hover{background:var(--bg);color:var(--ink)}

  /* ===== Sub bar ===== */
  .sub{height:40px;display:flex;align-items:center;padding:0 14px;gap:6px;border-bottom:1px solid var(--line);background:var(--card)}
  .chip{height:28px;padding:0 12px;border-radius:14px;font-size:12px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;cursor:pointer;transition:all .12s}
  .chip:hover{background:var(--bg)}
  .chip.active{background:var(--ink);color:var(--bg)}
  .chip .n{font-family:var(--m);font-size:11px;opacity:.75}
  .spacer{flex:1}
  .sort{position:relative;display:flex;align-items:center;gap:6px;height:28px;font-size:12px;color:var(--ink-3);cursor:pointer;margin-right:8px;padding:0 10px;border-radius:var(--r-sm);transition:all .12s}
  .sort:hover{background:var(--bg);color:var(--ink)}
  .sort.active{color:var(--ink);font-weight:600}
  .sort .arr{display:flex}
  .sort-menu{position:absolute;top:100%;left:0;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-hover);padding:4px;min-width:110px;opacity:0;transform:translateY(-4px);pointer-events:none;transition:all .15s ease;z-index:20}
  .sort.open .sort-menu{opacity:1;transform:translateY(0);pointer-events:auto}
  .sort-menu .si{width:100%;height:30px;padding:0 10px;border:none;background:transparent;border-radius:var(--r-xs);font-family:var(--f);font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .1s}
  .sort-menu .si:hover{background:var(--bg);color:var(--ink)}
  .sort-menu .si.active{color:var(--ink);font-weight:600}
  .sort-menu .si .ck{margin-left:auto;display:flex}
  .view-tabs{display:flex;gap:2px;padding:2px;background:var(--bg);border-radius:var(--r-md)}
  .view-tab{height:30px;padding:0 13px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s}
  .view-tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 10%,transparent)}
  .view-tab .n{font-family:var(--m);font-size:10px;color:var(--ink-3)}

  /* ===== Batch bar ===== */
  .batch{height:44px;display:none;align-items:center;padding:0 16px;gap:8px;background:var(--ink);color:var(--bg)}
  .batch.show{display:flex}
  .batch .sel{font-size:13px;font-weight:600}
  .batch .sel b{font-family:var(--m)}
  .batch .spacer{flex:1}
  .batch .btn{height:30px;font-size:12px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 25%,transparent)}
  .batch .btn:hover{background:color-mix(in srgb,var(--bg) 30%,transparent)}
  .batch .btn.danger{background:rgba(220,38,38,.55)}
  .batch .btn.danger:hover{background:rgba(220,38,38,.75)}

  /* ===== Content ===== */
  .content{flex:1;overflow:auto;padding:8px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .view{display:none}
  .view.active{display:block}

  /* ---- Card base ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 9px 7px 11px;cursor:pointer;position:relative;transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:9px;bottom:7px;width:3px;border-radius:0 2px 2px 0;background:var(--state,var(--ok))}
  .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--ink-4)}
  .card.selected{border-color:var(--ink);box-shadow:var(--shadow-hover)}
  .card .check{position:absolute;top:9px;left:11px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink-4);background:var(--card);display:none;align-items:center;justify-content:center;color:var(--bg);z-index:2}
  .sel-mode .card .check{display:flex}
  .card.checked .check{background:var(--ink);border-color:var(--ink)}
  .card.checked{border-color:var(--ink)}
  .card-actions{position:absolute;top:9px;right:9px;display:flex;gap:4px;z-index:2}
  .card:hover .card-actions .ca-main,
  .card:hover .card-actions .ca-menu,
  .card-actions:has(.dropdown.open) .ca-main,
  .card-actions:has(.dropdown.open) .ca-menu{opacity:1}
  .ca-main{width:26px;height:26px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:all .12s;opacity:0;color:var(--ink-2)}
  .card:hover .ca-main{opacity:1}
  .ca-main:hover{background:var(--bg);color:var(--ink)}
  .ca-main.play:hover{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
  .ca-main.restart:hover{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
  .ca-menu{width:26px;height:26px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:all .12s;opacity:0;color:var(--ink-2)}
  .card:hover .ca-menu{opacity:1}
  .ca-menu:hover,.ca-menu.open{background:var(--bg);color:var(--ink)}
  .ca-menu.open{border-color:var(--ink-4)}
  .dropdown{position:absolute;top:36px;right:9px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-hover);padding:4px;min-width:120px;opacity:0;transform:translateY(-4px);pointer-events:none;transition:all .15s ease;z-index:10}
  .dropdown.open{opacity:1;transform:translateY(0);pointer-events:auto}
  .dropdown .di{width:100%;height:30px;padding:0 10px;border:none;background:transparent;border-radius:var(--r-xs);font-family:var(--f);font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .1s}
  .dropdown .di:hover{background:var(--bg);color:var(--ink)}
  .dropdown .di.danger:hover{background:rgba(220,38,38,.10);color:var(--err)}
  .dropdown .di .ic{width:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .status-dot.on{background:var(--ok)}
  .status-dot.off{background:var(--stop)}

  /* ---- Container card ---- */
  .c-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.01em;word-break:break-word;line-height:1.3;padding-right:70px}
  .c-img{font-size:11px;color:var(--ink-2);font-family:var(--m);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-ports{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;align-items:center}
  .port{font-size:10px;font-family:var(--m);color:var(--ink-2);background:var(--line-2);padding:1px 6px;border-radius:var(--r-xs)}
  .port-more{font-size:10px;font-family:var(--m);color:var(--ink-3);padding:1px 5px;border-radius:var(--r-xs);cursor:pointer}
  .c-res{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:11px;color:var(--ink-2);font-family:var(--m)}
  .c-res .stat{display:flex;align-items:center;gap:4px;line-height:1}
  .c-res .stat .ic{display:flex;align-items:center;color:var(--ink-3)}
  .c-res .stat b{color:var(--ink);font-weight:600;line-height:1;display:flex;align-items:center}
  .c-res .status-dot{align-self:center}
  .proj-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--r-xs);letter-spacing:.02em;color:var(--ink-2);background:var(--line-2);white-space:nowrap}
  .proj-tag .dot{width:6px;height:6px;border-radius:3px;background:var(--proj-color,var(--accent))}

  /* ---- Image card ---- */
  .img-card .repo{font-size:14px;font-weight:700;word-break:break-word;line-height:1.3;padding-right:70px}
  .img-card .tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
  .img-card .tag{font-size:11px;font-weight:600;color:var(--ink);background:var(--line-2);padding:2px 8px;border-radius:var(--r-sm);font-family:var(--m)}
  .img-card .tag.latest{color:var(--warn)}
  .img-card .img-stats{display:flex;gap:16px;margin-top:7px;font-size:11px;color:var(--ink-2)}
  .img-card .img-stats div b{display:block;font-family:var(--m);font-size:13px;color:var(--ink);font-weight:600;margin-bottom:1px}

  /* ---- Network card ---- */
  .net-card .net-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;padding-right:70px}
  .net-card .net-name .bt{font-size:10px;color:var(--ink-3);font-weight:400}
  .net-card .net-sub{font-size:11px;color:var(--ink-2);margin-top:1px;font-family:var(--m)}
  .net-card .net-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .net-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);background:var(--line-2);color:var(--ink-2);font-family:var(--m)}
  .net-card .net-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:11px;color:var(--ink-2)}

  /* ---- Volume card ---- */
  .vol-card .vol-name{font-size:13px;font-weight:700;font-family:var(--m);padding-right:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vol-card .vol-mount{font-size:10px;color:var(--ink-3);font-family:var(--m);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vol-card .vol-foot{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--ink-2)}
  .vol-card .vol-foot b{font-family:var(--m);color:var(--ink);font-weight:600}
  .anon-tag{display:inline-block;font-size:10px;font-weight:600;color:var(--ink-3);background:var(--line-2);padding:1px 6px;border-radius:var(--r-xs);margin-top:2px}

  /* ===== Tooltip ===== */
  .tip{position:fixed;z-index:9999;background:var(--tip-bg);color:var(--tip-ink);font-size:11px;font-weight:500;padding:5px 9px;border-radius:var(--r-xs);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25);letter-spacing:.01em}
  .tip.show{opacity:1;transform:translateY(0)}
  .tip::after{content:"";position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--tip-arrow)}
  [data-tip]{position:relative}

  /* ===== Empty state ===== */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:420px;gap:12px;color:var(--ink-3);text-align:center}
  .empty .ico{opacity:.3}
  .empty h3{font-size:15px;font-weight:700;color:var(--ink-2)}
  .empty p{font-size:12px;color:var(--ink-3);max-width:320px}
  .empty .btn{margin-top:8px}

  /* ===== Skeleton ===== */
  .skel-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 9px 7px 11px;position:relative;overflow:hidden}
  .skel-card::before{content:"";position:absolute;left:0;top:9px;bottom:7px;width:3px;border-radius:0 2px 2px 0;background:var(--skel)}
  .skel{background:var(--skel);border-radius:4px;overflow:hidden;position:relative}
  .skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--skel-hi),transparent);animation:shimmer 1.4s infinite}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .skel-line{height:12px;margin-bottom:8px}
  .skel-line.w60{width:60%}.skel-line.w40{width:40%}.skel-line.w80{width:80%}

  /* ===== Drawer ===== */
  .drawer{position:absolute;top:0;right:0;bottom:0;width:400px;background:var(--card);border-left:1px solid var(--line);box-shadow:-20px 0 40px rgba(14,14,17,.08);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.16,1,.3,1);z-index:20}
  .drawer.open{transform:translateX(0)}
  .d-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:relative}
  .d-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:var(--r-sm);border:none;background:var(--bg);cursor:pointer;color:var(--ink-2);display:grid;place-items:center}
  .d-close:hover{background:var(--line)}
  .d-title{font-size:18px;font-weight:700;letter-spacing:-.01em;padding-right:30px;word-break:break-word}
  .d-sub{font-size:12px;color:var(--ink-2);font-family:var(--m);margin-top:4px}
  .d-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--card)}
  .d-tab{height:36px;padding:0 14px;font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-bottom:2px solid transparent;transition:all .12s}
  .d-tab.active{color:var(--ink);border-bottom-color:var(--ink)}
  .d-body{flex:1;overflow-y:auto;overflow-x:hidden;display:none}
  .d-body.active{display:block}
  .sec{padding:16px 20px;border-bottom:1px solid var(--line)}
  .sec h3{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}
  .kv{display:flex;align-items:flex-start;gap:12px;padding:5px 0}
  .kv .k{width:62px;flex-shrink:0;text-align:right;font-size:12px;color:var(--ink-3);padding-top:1px}
  .kv .v{flex:1;font-size:12px;color:var(--ink);font-weight:500;word-break:break-word}
  .kv .v.mono{font-family:var(--m);font-size:11px;color:var(--ink-2)}
  .kv .v.dim{color:var(--ink-3)}
  .box{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px;font-family:var(--m);font-size:11px;color:var(--ink-2);line-height:1.65;white-space:pre-wrap;word-break:break-all;margin-top:6px}
  .kv-list{display:flex;flex-direction:column;gap:4px;margin-top:4px}
  .kv-list .it{font-family:var(--m);font-size:11px;color:var(--ink-2);padding:4px 8px;background:var(--bg);border-radius:var(--r-xs);border:1px solid var(--line);word-break:break-all;overflow-wrap:break-word}

  /* ---- Logs ---- */
  .logs{background:var(--log-bg);color:var(--log-ink);font-family:var(--m);font-size:12px;line-height:1.7;padding:14px 16px;height:calc(100% - 36px);overflow-y:auto;overflow-x:hidden}
  .logs .ln{display:flex;gap:10px}
  .logs .t{color:var(--log-dim);flex-shrink:0}
  .logs .stdout{color:var(--log-ink);word-break:break-all;overflow-wrap:break-word}
  .logs .stderr{color:var(--err);word-break:break-all;overflow-wrap:break-word}

// ===== Persistence (localStorage) =====
const CFG_KEYS=['dp-view','dp-filter','dp-sort-field','dp-sort-desc','dp-search','dp-log-follow'];
function saveConfig(){
  localStorage.setItem('dp-view',currentView);
  localStorage.setItem('dp-filter',currentFilter);
  localStorage.setItem('dp-sort-field',sortField);
  localStorage.setItem('dp-sort-desc',sortDesc?'1':'0');
  localStorage.setItem('dp-search',searchQ);
  localStorage.setItem('dp-log-follow',logFollow?'1':'0');
}
function loadConfig(){
  const v=localStorage.getItem('dp-view');
  if(v&&['c','i','n','v'].includes(v)){currentView=v}
  const f=localStorage.getItem('dp-filter');
  if(f){currentFilter=f}
  const sf=localStorage.getItem('dp-sort-field');
  if(sf&&['name','cpu','mem','disk','on'].includes(sf)){sortField=sf}
  const sd=localStorage.getItem('dp-sort-desc');
  if(sd!==null){sortDesc=sd==='1'}
  const sq=localStorage.getItem('dp-search');
  if(sq!==null){searchQ=sq;const inp=document.getElementById('search-input');if(inp)inp.value=sq}
  const lf=localStorage.getItem('dp-log-follow');
  if(lf!==null){logFollow=lf==='1'}
}

// ===== Render =====
function hl(s){return searchQ?String(s).replace(new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):s}

const projColors={iouf:'#38bdf8'};
function projColor(p){return projColors[p]||'#a78bfa'}

function portsHTML(ports){
  if(!ports||!ports.length)return '';
  const max=3;
  const shown=ports.slice(0,max);
  const rest=ports.length-max;
  return `<div class="c-ports">${shown.map(p=>`<span class="port">${p}</span>`).join('')}${rest>0?`<span class="port-more" data-tip="${ports.slice(max).join(', ')}">+${rest}</span>`:''}</div>`;
}

function renderContainers(){
  const g=document.getElementById('container-grid');
  let list=containers;
  if(currentFilter==='running')list=list.filter(c=>c.on);
  if(currentFilter==='stopped')list=list.filter(c=>!c.on);
  if(currentFilter==='iouf')list=list.filter(c=>c.proj==='iouf');
  if(searchQ)list=list.filter(c=>c.name.includes(searchQ)||c.img.includes(searchQ));
  list=[...list].sort((a,b)=>{
    let av=a[sortField],bv=b[sortField];
    if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase()}
    return sortDesc?(av<bv?1:av>bv?-1:0):(av<bv?-1:av>bv?1:0);
  });
  if(list.length===0){g.innerHTML=emptyHTML(t('no_match_ctn'),t('try_adjust'));return}
  g.innerHTML=list.map(c=>{
    const idx=containers.indexOf(c);
    return `
    <div class="card" style="--state:${c.on?'var(--ok)':'var(--stop)'}${c.proj?';--proj-color:'+projColor(c.proj):''}" onclick="cardClick(this,'c',${idx})">
      <div class="check">${icon('check',10)}</div>
      <div class="c-name">${hl(c.name)}</div>
      <div class="c-img">${hl(c.img)}</div>
      ${portsHTML(c.ports)}
      <div class="c-res">
        <span class="status-dot ${c.on?'on':'off'}" data-tip="${c.on?t('running'):t('stopped')}"></span>
        <span class="stat" data-tip="${t('cpu_usage')}"><span class="ic">${icon('cpu',11)}</span><b>${c.on?c.cpu+'%':'—'}</b></span>
        <span class="stat" data-tip="${t('mem_usage')}"><span class="ic">${icon('memory',11)}</span><b>${c.on?c.mem+'M':'—'}</b></span>
        <span class="stat" data-tip="${t('disk_usage')}"><span class="ic">${icon('disk',11)}</span><b>${c.disk}M</b></span>
        ${c.proj?`<span class="proj-tag" style="--proj-color:${projColor(c.proj)};margin-left:auto" data-tip="${t('compose_project')}: ${c.proj}"><span class="dot"></span>${c.proj}</span>`:''}
      </div>
      <div class="card-actions">
        <button class="ca-main ${c.on?'restart':'play'}" data-tip="${c.on?t('restart'):t('start')}" onclick="event.stopPropagation();mainAction(this,'c',${idx})">${c.on?icon('restart',13):icon('play',13)}</button>
        <button class="ca-menu" data-tip="${t('more')}" onclick="event.stopPropagation();toggleMenu(this)">${icon('more-horizontal',12)}</button>
        <div class="dropdown">
          <button class="di" onclick="event.stopPropagation();menuAction(this,'stop','c',${idx})"><span class="ic">${icon('stop',13)}</span>${t('stop')}</button>
          <button class="di" onclick="event.stopPropagation();menuAction(this,'logs','c',${idx})"><span class="ic">${icon('file-text',13)}</span>${t('logs')}</button>
          <button class="di danger" onclick="event.stopPropagation();menuAction(this,'remove','c',${idx})"><span class="ic">${icon('trash',13)}</span>${t('remove')}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ===== Interactions =====
function setView(v){
  currentView=v;
  saveConfig();
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.view-tab').forEach(e=>e.classList.toggle('active',e.dataset.v===v));
  document.getElementById('batch').classList.remove('show');
  document.getElementById('app').classList.remove('sel-mode');
  document.querySelectorAll('.card.checked').forEach(e=>e.classList.remove('checked'));
}
function setChip(el){
  document.querySelectorAll('#chips .chip').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  currentFilter=el.dataset.filter||'all';
  saveConfig();
  renderContainers();
}
function doSearch(q){searchQ=q.trim();saveConfig();renderAll()}
function sortLabel(f){return {name:t('name'),cpu:'CPU',mem:t('memory'),disk:t('disk'),on:t('status')}[f]||f};
function toggleSortMenu(e){
  e.stopPropagation();
  const btn=document.getElementById('sort-btn');
  btn.classList.toggle('open');
}
function setSortField(field){
  if(field===sortField){sortDesc=!sortDesc}
  else{sortField=field;sortDesc=true}
  saveConfig();
  updateSortUI();
  renderContainers();
  document.getElementById('sort-btn').classList.remove('open');
}
function updateSortUI(){
  document.getElementById('sort-ic').innerHTML=icon('arrow-up-down',12);
  document.getElementById('sort-label').textContent=sortLabel(sortField);
  document.getElementById('sort-arr').innerHTML=icon(sortDesc?'arrow-down':'arrow-up',11);
  document.querySelectorAll('.sort-menu .si').forEach(si=>{
    const f=si.getAttribute('onclick').match(/'(\w+)'/)[1];
    si.classList.toggle('active',f===sortField);
    si.querySelector('.ck').innerHTML=f===sortField?icon(sortDesc?'arrow-down':'arrow-up',10):'';
  });
}
document.addEventListener('click',e=>{if(!e.target.closest('.sort'))document.getElementById('sort-btn').classList.remove('open')});

  const memStr=totalMem>=1024?(totalMem/1024).toFixed(1)+'G':totalMem+'M';
  const totalDisk=volumes.reduce((s,v)=>{
    const n=parseFloat(v.size);

  const diskStr=totalDisk>=1024?(totalDisk/1024).toFixed(1)+'G':totalDisk.toFixed(0)+'M';
  document.getElementById('ov-docker').innerHTML=`<span class="ov-ic">${icon('box',12)}</span><span class="ov-val">v26.1.4</span><span class="ov-lbl">Docker</span>`;

  const el=document.getElementById('log-lines');if(!el)return;
  const now=new Date();
  const t=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  const s=logSamples[logIdx%logSamples.length];logIdx++;
  const line=document.createElement('div');
  line.className='ln';
  line.innerHTML=`<span class="t">${t}</span><span class="${s[0]}">${s[1]}</span>`;
  el.appendChild(line);

}

// ---- Theme (auto / light / dark) ----
const THEME_MODES=['auto','light','dark'];
const THEME_ICONS={auto:'monitor',light:'sun',dark:'moon'};
function initTheme(){
  const saved=localStorage.getItem('dp-theme')||'auto';
  applyTheme(saved);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
    if(!localStorage.getItem('dp-theme')||localStorage.getItem('dp-theme')==='auto'){
      applyTheme('auto');
    }
  });
}
function applyTheme(mode){
  if(mode==='auto'){
    document.documentElement.removeAttribute('data-theme');
  }else{
    document.documentElement.setAttribute('data-theme',mode);
  }
  updateThemeIcon(mode);
}
function updateThemeIcon(mode){
  document.getElementById('theme-btn').innerHTML=icon(THEME_ICONS[mode]||'monitor',15);
}
function toggleTheme(){
  const cur=localStorage.getItem('dp-theme')||'auto';
  const idx=THEME_MODES.indexOf(cur);
  const next=THEME_MODES[(idx+1)%THEME_MODES.length];
  applyTheme(next);
  localStorage.setItem('dp-theme',next);
}

  if(type==='c'){
    if(data.on){toast(`${t('restart')} ${data.name}`)}

  }else if(type==='i'){toast(`${t('run')} ${data.repo}`)}
}
function menuAction(btn,action,type,idx){
  closeAllMenus();
  const data=type==='c'?containers[idx]:type==='i'?images[idx]:type==='n'?networks[idx]:volumes[idx];
  const name=data.name||data.repo;
  if(action==='stop'){data.on=false;toast(`${t('stop')} ${name}`);renderContainers()}
  else if(action==='logs'){openDetail(type,idx,'logs')}

}

// ---- Shortcuts ----
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea';
  // Ctrl+K focus search
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search-input').focus();return}
  // Ctrl+R refresh
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='r'){e.preventDefault();refresh();return}
  // Ctrl+1~4 switch view
  if((e.ctrlKey||e.metaKey)&&['1','2','3','4'].includes(e.key)){e.preventDefault();setView(['c','i','n','v'][parseInt(e.key)-1]);return}
  if(typing)return;
  // Esc close overlays
  if(e.key==='Escape'){
    if(document.querySelector('.overlay.show')){document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show'));return}
    if(document.getElementById('drawer').classList.contains('open')){closeDrawer();return}
    if(document.getElementById('app').classList.contains('sel-mode')){clearSel();return}
  }
  // / focus search
  if(e.key==='/'){e.preventDefault();document.getElementById('search-input').focus();return}
});

// ---- Tooltip ----
const tipEl=document.createElement('div');
tipEl.className='tip';
document.body.appendChild(tipEl);
let tipTimer=null;
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]');
  if(!t)return;
  clearTimeout(tipTimer);
  tipTimer=setTimeout(()=>{
    tipEl.textContent=t.dataset.tip;
    tipEl.style.visibility='hidden';
    tipEl.classList.add('show');
    const tw=tipEl.offsetWidth;
    const r=t.getBoundingClientRect();
    tipEl.style.left=Math.max(8,Math.min(window.innerWidth-tw-8,r.left+r.width/2-tw/2))+'px';
    tipEl.style.top=(r.top-tipEl.offsetHeight-8)+'px';
    tipEl.style.visibility='visible';
  },300);
});
document.addEventListener('mouseout',e=>{
  if(e.target.closest('[data-tip]')){clearTimeout(tipTimer);tipEl.classList.remove('show')}
});

// ---- Misc ----
function toast(msg){document.getElementById('foot-msg').textContent=msg;setTimeout(()=>document.getElementById('foot-msg').textContent=t('ready'),2000)}
function refresh(){
  ['container-grid','image-grid','network-grid','volume-grid'].forEach(id=>document.getElementById(id).innerHTML=skeletonHTML());
  setTimeout(()=>{renderAll();toast(t('refreshed'))},500);
}

// ---- Init ----
initTheme();
applyLang();
loadConfig();
document.getElementById('search-ic').innerHTML=icon('search',13);
document.getElementById('refresh-btn').innerHTML=icon('refresh',15);
document.getElementById('cleanup-btn').innerHTML=icon('trash',13);
document.getElementById('pull-btn').innerHTML=icon('download',13);
document.getElementById('drawer-close').innerHTML=icon('x',15);
document.getElementById('brand-mark').innerHTML=icon('box',14);
document.getElementById('batch-start').innerHTML=icon('play',13);
document.getElementById('batch-stop').innerHTML=icon('stop',13);
document.getElementById('batch-restart').innerHTML=icon('restart',13);
document.getElementById('batch-remove').innerHTML=icon('trash',13);
document.getElementById('log-follow').innerHTML=icon(logFollow?'play':'pause',12);
document.getElementById('log-follow').classList.toggle('active',logFollow);
document.querySelectorAll('.log-toolbar .lt-btn')[1].innerHTML=icon('copy',12);
document.querySelectorAll('.log-toolbar .lt-btn')[2].innerHTML=icon('trash',12);
// restore view tab + container active state
document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id==='view-'+currentView));
document.querySelectorAll('.view-tab').forEach(e=>e.classList.toggle('active',e.dataset.v===currentView));
document.querySelectorAll('#chips .chip').forEach(e=>e.classList.toggle('active',(e.dataset.filter||'all')===currentFilter));
updateThemeIcon();
updateSortUI();
renderAll();
openDetail('c',0);
</script>
